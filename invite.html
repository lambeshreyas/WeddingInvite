                >
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    Replay Opening Envelope

    <!-- LOGIC ENGINE -->
    <script>
        // AUDIO SYNTH
        class AmbientSoundEngine {
            constructor() { this.ctx = null; this.isPlaying = false; }
            init() { if (!this.ctx) { const AudioCtx = window.AudioContext || window.webkitAudioContext; this.ctx = new AudioCtx(); } }
            play() { this.init(); if (this.ctx.state === 'suspended') this.ctx.resume(); this.isPlaying = true; this.schedule(); }
            stop() { this.isPlaying = false; }
            toggle() { if (this.isPlaying) this.stop(); else this.play(); return this.isPlaying; }
            schedule() {
                if (!this.isPlaying) return;
                const scale = [220, 247.5, 275, 330, 371.25, 440];
                const freq = scale[Math.floor(Math.random() * scale.length)];
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.04, this.ctx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 2.1);
                setTimeout(() => this.schedule(), Math.random() * 800 + 600);
            }
        }
        const audioEngine = new AmbientSoundEngine();

        // FLOW MANAGEMENT (TAP ANYWHERE ON ENVELOPE)
        let isOpening = false;
        function handleEnvelopeClick(e) {
            if (isOpening) return;
            isOpening = true;

            const ripple = document.getElementById('rippleContainer');

            // Spawn Golden Ripple Ring across screen tap location
            if (ripple) {
                const ring = document.createElement('div');
                ring.className = 'absolute inset-0 rounded-full border-2 border-gold ripple-effect';
                ripple.appendChild(ring);
            }

            // Transition directly to Video Overlay
            setTimeout(() => {
                const envOverlay = document.getElementById('envelopeOverlay');
                envOverlay.style.opacity = '0';
                
                setTimeout(() => {
                    envOverlay.style.display = 'none';
                    startVideoPlayback();
                }, 600);
            }, 300);
        }

        function startVideoPlayback() {
            const vidOverlay = document.getElementById('videoOverlay');
            const video = document.getElementById('weddingIntroVideo');

            vidOverlay.classList.remove('hidden');
            vidOverlay.style.display = 'flex';
            setTimeout(() => { vidOverlay.style.opacity = '1'; }, 50);

            video.muted = false;
            video.currentTime = 0;

            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(err => {
                    console.warn("Autoplay with audio restricted, trying muted fallback:", err);
                    video.muted = true;
                    document.getElementById('soundLabel').textContent = "Unmute";
                    video.play().catch(() => {
                        document.getElementById('videoErrorMsg').classList.remove('hidden');
                    });
                });
            }

            video.onended = () => {
                transitionToHomepage();
            };
        }

        function toggleVideoSound() {
            const video = document.getElementById('weddingIntroVideo');
            const label = document.getElementById('soundLabel');
            video.muted = !video.muted;
            label.textContent = video.muted ? "Unmute" : "Sound On";
        }

        function transitionToHomepage() {
            const video = document.getElementById('weddingIntroVideo');
            video.pause();

            const vidOverlay = document.getElementById('videoOverlay');
            vidOverlay.style.opacity = '0';

            setTimeout(() => {
                vidOverlay.style.display = 'none';
                vidOverlay.classList.add('hidden');
                
                const mainContent = document.getElementById('mainWebsiteContent');
                mainContent.classList.remove('hidden');

                // Mark session so repetition doesn't occur on refresh
                sessionStorage.setItem('sd_wedding_opened', 'true');

                audioEngine.play();
            }, 800);
        }

        function replayOpeningExperience() {
            sessionStorage.removeItem('sd_wedding_opened');
            window.location.reload();
        }

        // ROYAL EVENTS DATA
        const royalEventsData = [
            { id: 1, date: "26 JAN 2027", name: "Kulachar", time: "MORNING", desc: "Auspicious ancestral blessings and traditional rituals.", attire: "Ethnic Yellow/Gold", image: "https://images.unsplash.com/photo-1544078751-58fee2d8a03b?auto=format&fit=crop&q=80&w=600" },
            { id: 2, date: "27 JAN 2027", name: "Upanayan Sanskar", time: "MORNING", desc: "Sacred Vedic initiation and thread ceremony.", attire: "White & Saffron Silks", image: "https://images.unsplash.com/photo-1609357605129-26f69add5d6e?auto=format&fit=crop&q=80&w=600" },
            { id: 3, date: "27 JAN 2027", name: "DJ Night", time: "NIGHT", desc: "High-energy music and dancing under the stars.", attire: "Cocktail Wear", image: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&q=80&w=600" },
            { id: 4, date: "28 JAN 2027", name: "Haldi", time: "MORNING", desc: "Turmeric, marigolds, and joyous splashes.", attire: "Sunshine Yellow", image: "https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&q=80&w=600" },
            { id: 5, date: "28 JAN 2027", name: "Sangeet Night", time: "NIGHT", desc: "Music, dance performances, and family toasts.", attire: "Indo-Western Glam", image: "https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&q=80&w=600" },
            { id: 6, date: "29 JAN 2027", name: "The Wedding", time: "MUHURAT", desc: "Seven holy vows around the sacred flame.", attire: "Heritage Royal", image: "https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&q=80&w=600" },
            { id: 7, date: "30 JAN 2027", name: "Satyanarayan Pooja", time: "MORNING", desc: "Seeking divine blessings for our new journey.", attire: "Graceful Ethnic", image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&q=80&w=600" },
            { id: 8, date: "31 JAN 2027", name: "Reception", time: "NIGHT", desc: "Grand royal evening and celebratory dinner.", attire: "Black Tie / Elegant", image: "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80&w=600" }
        ];

        let flipped = {};

        function renderTimeline() {
            const container = document.getElementById('royalTimelineContainer');
            if (!container) return;
            container.innerHTML = royalEventsData.map(ev => {
                const isFlipped = !!flipped[ev.id];
                return \`
                    <div class="relative card-perspective">
                        <div class="absolute -left-[37px] top-4 w-7 h-7 rounded-full bg-ivory border-2 border-gold flex items-center justify-center text-[10px] text-wine font-bold shadow-md">
                            \${ev.id}
                        </div>

                        <div onclick="toggleFlip(\${ev.id})" class="card-inner \${isFlipped ? 'flipped' : ''} relative cursor-pointer w-full min-h-[220px] rounded-xs shadow-md border border-gold/40">
                            <div class="card-front absolute inset-0 bg-charcoal p-4 rounded-xs flex flex-col justify-between overflow-hidden">
                                <img src="\${ev.image}" class="absolute inset-0 w-full h-full object-cover opacity-45">
                                <div class="absolute inset-0 bg-gradient-to-t from-charcoal via-charcoal/50 to-transparent"></div>
                                <div class="relative z-10 flex justify-between items-center text-[9px]">
                                    <span class="bg-wine text-ivory px-2 py-0.5 rounded-xs border border-gold/30">\${ev.date}</span>
                                    <span class="bg-champagne text-wine font-bold px-2 py-0.5 rounded-xs uppercase">\${ev.time}</span>
                                </div>
                                <div class="relative z-10 my-auto">
                                    <h3 class="font-serif text-xl text-champagne">\${ev.name}</h3>
                                </div>
                                <div class="relative z-10 text-[9px] text-gold flex justify-between items-center border-t border-gold/30 pt-2">
                                    <span>Tap for Details</span>
                                    <span>🔄 Flip</span>
                                </div>
                            </div>

                            <div class="card-back absolute inset-0 bg-ivory p-4 rounded-xs text-charcoal flex flex-col justify-between border border-gold">
                                <div>
                                    <h3 class="font-serif text-lg text-wine border-b border-gold/30 pb-1">\${ev.name}</h3>
                                    <p class="text-[11px] text-charcoal/90 mt-2">\${ev.desc}</p>
                                    <p class="text-[10px] font-semibold text-wine mt-2">👗 Dress Code: <span class="font-normal">\${ev.attire}</span></p>
                                </div>
                                <button onclick="event.stopPropagation(); toggleFlip(\${ev.id})" class="w-full py-1.5 bg-wine text-ivory text-[9px] uppercase tracking-wider rounded-xs border border-gold">
                                    Flip Back
                                </button>
                            </div>
                        </div>
                    </div>
                \`;
            }).join('');
        }

        function toggleFlip(id) {
            flipped[id] = !flipped[id];
            renderTimeline();
        }

        function shareWhatsApp() {
            window.open('https://wa.me/?text=Namaste!%20Join%20us%20for%20Shreyas%20%26%20Damini%27s%20Wedding.', '_blank');
        }

        function updateTimer() {
            const target = new Date("2027-01-29T10:30:00+05:30").getTime();
            const diff = target - new Date().getTime();
            if (diff > 0) {
                document.getElementById('timerDays').textContent = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
                document.getElementById('timerHours').textContent = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
                document.getElementById('timerMinutes').textContent = String(Math.floor((diff / 1000 / 60) % 60)).padStart(2, '0');
                document.getElementById('timerSeconds').textContent = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');
            }
        }
        setInterval(updateTimer, 1000);

        document.addEventListener('DOMContentLoaded', () => {
            renderTimeline();
            updateTimer();

            // Check if already opened in current session
            if (sessionStorage.getItem('sd_wedding_opened') === 'true') {
                const envOverlay = document.getElementById('envelopeOverlay');
                if (envOverlay) envOverlay.style.display = 'none';
                
                const mainContent = document.getElementById('mainWebsiteContent');
                if (mainContent) mainContent.classList.remove('hidden');
                
                audioEngine.play();
            }

            document.getElementById('audioToggleBtn').addEventListener('click', () => audioEngine.toggle());
        });
    <\/script>
</body>
</html>`;

        // DEVICE SIMULATOR LOGIC
        const devices = {
            iphone15: { width: 393, height: 852, notchWidth: 'w-28', notchHeight: 'h-7', label: 'iPhone 15 Pro' },
            pixel8: { width: 412, height: 915, notchWidth: 'w-8', notchHeight: 'h-8', label: 'Pixel 8' },
            s24: { width: 360, height: 780, notchWidth: 'w-6', notchHeight: 'h-6', label: 'Galaxy S24' }
        };

        let currentDevice = 'iphone15';
        let isLandscape = false;

        function setDevice(deviceKey) {
            currentDevice = deviceKey;
            ['iphone15', 'pixel8', 's24'].forEach(key => {
                const btn = document.getElementById(`btn-${key}`);
                if (key === deviceKey) {
                    btn.className = "px-3 py-1.5 rounded-md font-medium text-gold bg-wine border border-gold/40 transition-all flex items-center gap-1.5 cursor-pointer shadow-sm";
                } else {
                    btn.className = "px-3 py-1.5 rounded-md font-medium text-ivory/70 hover:text-gold transition-all flex items-center gap-1.5 cursor-pointer";
                }
            });
            updatePhoneFrame();
        }

        function toggleOrientation() {
            isLandscape = !isLandscape;
            document.getElementById('orientationLabel').textContent = isLandscape ? 'Landscape' : 'Portrait';
            updatePhoneFrame();
        }

        function updatePhoneFrame() {
            const dev = devices[currentDevice];
            const casing = document.getElementById('phoneCasing');
            const dimBadge = document.getElementById('dimBadge');

            let targetWidth = isLandscape ? dev.height : dev.width;
            let targetHeight = isLandscape ? dev.width : dev.height;

            casing.style.width = `${targetWidth}px`;
            casing.style.height = `${targetHeight}px`;

            dimBadge.textContent = `${targetWidth} × ${targetHeight} px`;
        }

        function updateClock() {
            const now = new Date();
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clockDisplay').textContent = `${hrs}:${mins}`;
        }

        // INITIALIZE ON LOAD
        window.onload = function() {
            const iframe = document.getElementById('previewFrame');
            iframe.srcdoc = weddingAppSrc;
            updatePhoneFrame();
            updateClock();
            setInterval(updateClock, 10000);
        };
    </script>
